<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Operations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>JavaScript Array Operations</h2>

    <input type="number" id="value" placeholder="Enter Number">

    <div class="buttons">
        <button onclick="pushItem()">Push</button>
        <button onclick="popItem()">Pop</button>
        <button onclick="shiftItem()">Shift</button>
        <button onclick="unshiftItem()">Unshift</button>
        <button onclick="spliceItem()">Splice</button>
        <button onclick="sliceItem()">Slice</button>
        <button onclick="mapItem()">Map</button>
        <button onclick="filterItem()">Filter</button>
        <button onclick="reduceItem()">Reduce</button>
        <button onclick="forEachItem()">forEach</button>
    </div>

    <h3>Current Array</h3>
    <p id="array"></p>

    <h3>Result</h3>
    <p id="result"></p>

</div>

<script src="script.js"></script>

</body>
</html>

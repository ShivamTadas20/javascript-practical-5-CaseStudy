<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Shopping Cart</h1>
            <p>Add products with price and quantity, then use cart actions.</p>
        </div>
    </header>

    <div class="product-form">
        <label>
            Item Name
            <input type="text" id="name" placeholder="Example: Sneakers" maxlength="30">
        </label>
        <label>
            Price ($)
            <input type="number" id="price" placeholder="1 - 1000" min="1" max="1000">
        </label>
        <label>
            Quantity
            <input type="number" id="quantity" placeholder="1 - 10" min="1" max="10">
        </label>
        <button class="primary" onclick="addItem()">Add to Cart</button>
    </div>

    <div class="buttons">
        <button onclick="removeLastItem()">Remove Last Item</button>
        <button onclick="clearCart()">Clear Cart</button>
        <button onclick="totalAmount()">Show Total</button>
        <button onclick="expensiveItems()">Expensive Items</button>
        <button onclick="listNames()">List Item Names</button>
    </div>

    <section class="cart-panel">
        <h2>Cart Items</h2>
        <div id="cart"></div>
    </section>

    <section class="result-panel">
        <h2>Result</h2>
        <p id="result">Your cart is empty.</p>
    </section>
</div>

<script src="script.js"></script>

</body>
</html>
